/* Schriften lokal gehostet (keine Verbindung zu Google) */
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:normal;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:500;font-display:swap;src:url(fonts/cormorant-garamond-latin-500-italic.woff2) format('woff2')}
@font-face{font-family:'Cormorant Garamond';font-style:italic;font-weight:600;font-display:swap;src:url(fonts/cormorant-garamond-latin-600-italic.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:300;font-display:swap;src:url(fonts/jost-latin-300-normal.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:400;font-display:swap;src:url(fonts/jost-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Jost';font-style:normal;font-weight:500;font-display:swap;src:url(fonts/jost-latin-500-normal.woff2) format('woff2')}
:root{
  --paper:#f6f1e8; --card:#fffdf8; --ink:#231f1c; --muted:#6f665d; --line:#e4dccf;
  --wine:#7d2436; --wine-soft:#f3e4e5; --vito:#2c6a8c; --vito-soft:#e5eef3; --gold:#b08a4a;
  --serif:'Cormorant Garamond',Georgia,serif; --sans:'Jost','Gill Sans','Helvetica Neue',Arial,sans-serif;
  --r:14px; --max:760px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{background:var(--paper);color:var(--ink);font-family:var(--sans);font-weight:400;font-size:16px;line-height:1.5;min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
a{color:inherit}
.hidden{display:none!important}

/* ---------- Popup ---------- */
#popup{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:20px;
  background:rgba(25,20,16,.72);opacity:0;visibility:hidden;transition:opacity .3s ease,visibility .3s}
#popup.show{opacity:1;visibility:visible}
#popup .pop-box{position:relative;max-width:min(480px,100%);max-height:100%;transform:scale(.96);transition:transform .3s ease}
#popup.show .pop-box{transform:scale(1)}
#popup img{display:block;max-width:100%;max-height:calc(100vh - 110px);width:auto;height:auto;border-radius:12px;box-shadow:0 20px 60px rgba(0,0,0,.45)}
#popup .pop-close{position:absolute;top:-14px;right:-14px;width:40px;height:40px;border-radius:50%;background:var(--card);color:var(--ink);
  font-size:24px;line-height:1;box-shadow:0 4px 14px rgba(0,0,0,.3);display:grid;place-items:center}
#popup .pop-go{display:block;margin:14px auto 0;padding:11px 26px;border-radius:999px;background:var(--card);color:var(--ink);font-size:15px;letter-spacing:.03em}

/* ---------- Header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(246,241,232,.94);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.bar{max-width:var(--max);margin:0 auto;padding:12px 16px 0;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;line-height:1.05}
.brand small{font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.brand img{height:26px;width:auto;display:block;margin-top:3px}
.brand b{font-family:var(--serif);font-weight:600;font-size:26px}
.lang-toggle{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang-toggle button{padding:5px 11px;border-radius:999px;font-size:13px;letter-spacing:.08em;color:var(--muted)}
.lang-toggle button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tabs{max-width:var(--max);margin:0 auto;padding:10px 16px 0;display:flex;gap:4px}
.tab{flex:1;padding:10px 4px 12px;font-size:14px;letter-spacing:.03em;color:var(--muted);border-bottom:2px solid transparent;white-space:nowrap}
.tab[aria-selected="true"]{color:var(--ink);border-color:var(--wine);font-weight:500}
.chips{max-width:var(--max);margin:0 auto;display:flex;gap:8px;overflow-x:auto;padding:10px 16px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:6px 13px;border:1px solid var(--line);border-radius:999px;font-size:13px;background:var(--card);color:var(--muted);white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.chip.vito{border-color:var(--vito);color:var(--vito)}
.chip.vito.on{background:var(--vito);color:#fff}

/* ---------- Content ---------- */
main{max-width:var(--max);margin:0 auto;padding:8px 16px 40px}
.hero{margin:0 -16px;aspect-ratio:1672/941;background:#1c1916;overflow:hidden}
.hero img{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:640px){.hero{margin:16px 0 0;border-radius:var(--r)}}
.hero + .panel-head{padding-top:14px}
.panel-head.sub-only h1{font-size:28px}
.panel-head{text-align:center;padding:26px 0 14px}
.panel-head .kicker{font-size:11px;letter-spacing:.3em;text-transform:uppercase;color:var(--muted)}
.panel-head h1{font-family:var(--serif);font-weight:600;font-size:40px;line-height:1.05;margin:6px 0}
.panel-head p{color:var(--muted);font-size:14px;max-width:520px;margin:0 auto}
.badge-date{display:inline-block;margin-top:10px;padding:5px 14px;border-radius:999px;background:var(--wine);color:#fff;font-size:13px;letter-spacing:.05em}
.badge-date.old{background:var(--muted)}

section.cat{scroll-margin-top:170px;margin-top:26px}
.cat-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink);padding-bottom:6px;margin-bottom:4px}
.cat-title h2{font-family:var(--serif);font-weight:600;font-size:27px;letter-spacing:.02em}
.cat-title span{font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted)}
.cat-img{margin:0 -16px 14px;height:clamp(150px,42vw,240px);overflow:hidden;background:#ece4d6}
.cat-img img{width:100%;height:100%;object-fit:cover;display:block}
@media (min-width:640px){.cat-img{margin:0 0 14px;border-radius:var(--r)}}
.item .thumb{display:block;width:100%;aspect-ratio:16/9;object-fit:cover;border-radius:10px;margin-top:10px;background:#ece4d6}
.cat-intro{font-size:13.5px;color:var(--wine);margin:8px 0 2px}

.item{display:grid;grid-template-columns:auto 1fr auto;column-gap:12px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .no{font-size:12px;color:var(--muted);min-width:26px;padding-top:4px;font-variant-numeric:tabular-nums}
.item .no:empty{min-width:0}
.item h3{font-family:var(--serif);font-weight:600;font-size:20px;line-height:1.2;letter-spacing:.01em}
.item .sub{display:block;font-size:12px;color:var(--muted);letter-spacing:.05em;margin-top:1px;font-family:var(--sans);font-weight:400}
.item p{font-size:14.5px;color:var(--muted);margin-top:3px;font-weight:300}
.item p.it{font-style:italic}
.item .price{font-size:16px;font-weight:500;white-space:nowrap;padding-top:2px;font-variant-numeric:tabular-nums;text-align:right}
.item .price.txt{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:400;max-width:110px;white-space:normal}
.item.vito{background:var(--vito-soft);border:1px solid var(--vito);border-radius:10px;padding:14px 12px;margin:10px 0}
.item.vito h3{color:var(--vito)}
.vtag{display:inline-block;font-family:var(--serif);font-style:italic;font-size:14px;color:var(--vito);border:1px solid var(--vito);border-radius:4px;padding:0 6px;margin-top:6px;background:#fff}
.item.wine h3{color:var(--wine)}
.more{margin-top:6px;font-size:13px;color:var(--wine);text-decoration:underline;text-underline-offset:3px}
.wine-text{font-size:14px;color:var(--muted);margin-top:6px;font-weight:300}
.wine-text b{font-weight:500;color:var(--ink)}
.glass{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px;margin-top:6px}
.glass span{white-space:nowrap}
.glass b{font-weight:500}

.note{display:flex;gap:10px;margin:14px 0 0;padding:12px 14px;border-radius:10px;background:var(--wine-soft);color:var(--wine);font-size:13.5px}
.note::before{content:"i";flex:none;width:20px;height:20px;border-radius:50%;background:var(--wine);color:#fff;font-family:var(--serif);font-style:italic;font-weight:600;display:grid;place-items:center;font-size:14px}
.note ul{list-style:none}
.extras{margin-top:10px;font-size:14px}
.extras div{display:flex;justify-content:space-between;gap:10px;padding:5px 0;border-bottom:1px dotted var(--line);color:var(--muted)}
.extras b{font-weight:500;color:var(--ink);white-space:nowrap}
.doneness{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:13.5px;margin-top:4px}

.intro-card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:20px 18px;margin-top:18px}
.intro-card blockquote{font-family:var(--serif);font-style:italic;font-size:20px;line-height:1.3;text-align:center}
.intro-card cite{display:block;text-align:center;font-size:12px;color:var(--muted);margin-top:4px;font-style:normal;letter-spacing:.06em}
.intro-card details{margin-top:14px;border-top:1px solid var(--line);padding-top:10px}
.intro-card summary{cursor:pointer;font-size:14px;color:var(--wine);list-style:none}
.intro-card summary::-webkit-details-marker{display:none}
.intro-card summary::after{content:" +"}
.intro-card details[open] summary::after{content:" –"}
.intro-card h4{font-size:12px;letter-spacing:.2em;text-transform:uppercase;margin:14px 0 4px}
.intro-card p{font-size:14px;color:var(--muted);font-weight:300}
.intro-card .sign{font-family:var(--serif);font-style:italic;font-size:18px;color:var(--ink);margin-top:14px}

.vito-box{border:1px solid var(--vito);background:var(--vito-soft);border-radius:var(--r);padding:16px 18px;margin-top:14px;color:var(--vito)}
.vito-box b{font-family:var(--serif);font-style:italic;font-size:24px;font-weight:600;display:block}
.vito-box p{font-size:14px;margin-top:4px}

.search{position:relative;margin-top:16px}
.search input{width:100%;padding:12px 40px 12px 16px;border:1px solid var(--line);border-radius:999px;background:var(--card);font:inherit;font-size:15px;color:var(--ink)}
.search input:focus{outline:2px solid var(--ink);outline-offset:1px}
.search button{position:absolute;right:10px;top:50%;transform:translateY(-50%);width:28px;height:28px;border-radius:50%;color:var(--muted);font-size:18px}
.empty{text-align:center;color:var(--muted);padding:40px 0;font-style:italic;font-family:var(--serif);font-size:20px}
.foot-small{text-align:center;font-size:12px;color:var(--muted);margin-top:22px}

footer{background:var(--ink);color:#e9e2d6;margin-top:30px}
.foot{max-width:var(--max);margin:0 auto;padding:34px 16px 44px;text-align:center}
.foot b{font-family:var(--serif);font-size:30px;font-weight:600;display:block;color:#fff}
.foot p{font-size:14px;opacity:.85;margin-top:6px}
.foot-actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:18px}
.foot-actions a{text-decoration:none;border:1px solid rgba(255,255,255,.35);padding:10px 18px;border-radius:999px;font-size:14px}
.foot-actions a:hover{background:#fff;color:var(--ink)}
.foot .legal{margin-top:18px;font-size:14px}
.foot .legal a{color:#fff;text-decoration:underline;text-underline-offset:3px}
.foot .fine{font-size:12px;opacity:.6;margin-top:20px}
.qr-menu-wrap{display:flex;justify-content:center;margin:22px auto 4px}
.qr-menu-wrap img{display:block;width:112px;height:auto}

@media (min-width:640px){
  .panel-head h1{font-size:50px}
  .item h3{font-size:21px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

<!-- Popup: zeigt popup.jpg aus demselben Ordner. Datei fehlt -> kein Popup. -->
<div id="popup" role="dialog" aria-modal="true" aria-label="Aktuelles">
  <div class="pop-box">
    <img id="pop-img" alt="">
    <button class="pop-close" id="pop-x" aria-label="Schließen">×</button>
    <button class="pop-go" id="pop-go"></button>
  </div>
</div>

       txt:{de:'Dieser Vermentino begeistert mit einer vielschichtigen Aromatik aus Blüten, reifen Zitrusfrüchten und mediterranen Kräutern. Am Gaumen zeigt er sich harmonisch, weich und ausgewogen, mit dezenter Säure – Anklänge von frischem Thymian und einem Hauch Rosmarin runden das Geschmackserlebnis ab. Trotz der sandigen Böden bewahrt der Wein eine bemerkenswerte Mineralität und eine lebendige Frische, die im eleganten Abgang lange nachklingt. Ein Allrounder, der sich vielen Gerichten dieser Karte anpasst.',
            en:'This Vermentino delights with a multi-layered bouquet of blossoms, ripe citrus fruit and Mediterranean herbs. On the palate it is harmonious, soft and balanced, with subtle acidity – hints of fresh thyme and a touch of rosemary round off the experience. Despite the sandy soils, the wine keeps a remarkable minerality and a lively freshness that lingers in the elegant finish. An all-rounder that pairs with many dishes on this menu.'},

/* =====================================================================
   APP
   ===================================================================== */
let lang = 'de', tab = 'mittag', filter = 'all', query = '';
const $ = s => document.querySelector(s);
const L = x => x == null ? '' : (typeof x === 'string' || typeof x === 'number') ? String(x) : (x[lang] ?? x.de);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const money = n => Number(n).toLocaleString(lang === 'de' ? 'de-DE' : 'en-GB', {minimumFractionDigits:0, maximumFractionDigits:2});
const vol = n => lang === 'de' ? String(n).replace('.', ',') + ' l' : n + ' l';

function fmtDate(iso){ const [y,m,d] = iso.split('-'); return lang==='de' ? `${d}.${m}.${y}` : `${d}/${m}/${y}`; }

function priceHTML(p){
  if (typeof p === 'number') return `<div class="price">${money(p)}</div>`;
  return `<div class="price txt">${esc(L(p))}</div>`;
}
function itemHTML(it, opts = {}){
  const desc = it.d ? L(it.d) : L(it[lang] !== undefined ? it[lang] : it.de);
  return `<article class="item${it.v ? ' vito' : ''}">
    <div class="no">${it.n ?? ''}</div>
    <div>
      <h3>${esc(L(it.name))}${it.sub ? `<span class="sub">${esc(L(it.sub))}</span>` : ''}</h3>
      ${desc ? `<p>${esc(desc)}</p>` : ''}
      ${it.it ? `<p class="it">${esc(L(it.it))}</p>` : ''}
      ${it.v ? `<span class="vtag">Vito's</span>` : ''}
      ${it.img ? `<img class="thumb" src="${it.img}" alt="" loading="lazy">` : ''}
    </div>
    ${priceHTML(it.p)}
  </article>`;
}
function notesHTML(c){
  let h = '';
  if (c.extras) h += `<div class="extras"><div style="border:0;color:var(--ink);font-weight:500">${esc(L(c.extrasTitle))}</div>${c.extras.map(([l,p]) => `<div><span>${esc(L(l))}</span><b>+ ${money(p)}</b></div>`).join('')}</div>`;
  if (c.notes) h += `<div class="note"><ul>${c.notes[lang].map(n => `<li>${esc(n)}</li>`).join('')}</ul></div>`;
  if (c.doneness) h += `<div class="note"><div><b>${UI[lang].doneTitle}</b><div class="doneness">
      <span>Rare</span><span>45–52 °C</span><span>Medium Rare</span><span>53–56 °C</span><span>Medium</span><span>57–59 °C</span><span>Well Done</span><span>60–63 °C</span></div></div></div>`;
  return h;
}

/* ---- Titelbild je Bereich (img/banner-….webp) ---- */
const hero = (file, alt) => `<figure class="hero"><img src="${IMG}${file}" alt="${esc(alt)}"></figure>`;

/* ---- Mittag ---- */
function renderMittag(){
  const u = UI[lang];
  const ende = MITTAG.bis ? new Date(MITTAG.bis + 'T23:59:59') : null;
  const expired = !!ende && !Number.isNaN(ende.getTime()) && ende < new Date();
  const zeitraum = [MITTAG.von, MITTAG.bis].filter(Boolean).map(fmtDate).join(' – ');
  const datum = expired ? u.expired : (zeitraum ? `${u.valid} ${zeitraum}` : '');
  return `${hero('banner-mittagstisch.webp', u.mittagTitle)}<div class="panel-head">${lang==='en' ? `<div class="kicker">${u.mittagTitle}</div>` : ''}
    ${datum ? `<span class="badge-date${expired ? ' old' : ''}">${datum}</span>` : ''}</div>
    <section class="cat" style="margin-top:8px">${MITTAG.items.map(i => itemHTML(i)).join('')}
    ${MITTAG.hinweis ? `<div class="note">${esc(L(MITTAG.hinweis))}</div>` : ''}</section>
    <div class="qr-menu-wrap"><img src="${IMG}qr-code-speisekarte-kompakt.png" alt="QR-Code zur Speisekarte" loading="lazy"></div>
    <p class="foot-small">${u.fine}</p>`;
}

/* ---- Speciale ---- */
function renderSpeciale(){
  const u = UI[lang];
  let h = `${hero('banner-speciale.webp', u.speTitle)}<div class="panel-head"><p>${u.speSub}</p></div>`;
  for (const c of SPECIALE){
    h += `<section class="cat" id="${c.id}"><div class="cat-title"><h2>${esc(L(c.t))}</h2></div>`;
    if (c.wine){
      h += `<p class="cat-intro">${esc(L(c.intro))}</p>` + c.halves.map(w => itemHTML({...w})).join('');
      h += c.wines.map((w,i) => `<article class="item wine"><div class="no"></div><div>
          <h3>${esc(w.name)}</h3><p>${esc(L(w.meta))}</p>
          <div class="glass">${w.glass.map(([v,p]) => `<span>${v===0.75?u.bottle:u.glass} ${vol(v)} · <b>${money(p)}</b></span>`).join('')}</div>
          <div class="wine-text hidden" id="wt${i}">${esc(L(w.txt))}<br><br><b>${u.rec}</b> ${esc(L(w.rec))}</div>
          <button class="more" data-more="wt${i}">${u.more}</button></div><div></div></article>`).join('');
    } else {
      h += c.items.map(i => itemHTML(i)).join('');
      if (c.after) h += `<div class="note">${esc(L(c.after))}</div>`;
    }
    h += `</section>`;
  }
  return h + `<p class="foot-small">${u.fine}</p>`;
}

/* ---- Veröffentliche Studio-Karten übernehmen ---- */
async function studioKartenLaden(){
  try{
    const antwort = await fetch('menu.json', {cache:'no-store'});
    if(!antwort.ok) return;
    const daten = await antwort.json();
    const textNorm = text => String(text || '').trim().toLocaleLowerCase('de');
    const gerichte = karte => (karte.sections || []).flatMap(s => s.items || [])
      .filter(i => i && (String(i.name || '').trim() || String(i.desc || '').trim()))
      .map(i => {
        const name = String(i.name || '').trim();
        const desc = String(i.desc || '').trim();
        const item = {
          name: {de:name, en:String(i.nameEn || Woerterbuch.uebersetzen(name))},
          d: {de:desc, en:String(i.descEn || Woerterbuch.uebersetzen(desc))}
        };
        if(i.price !== null && i.price !== undefined && i.price !== ''){
          const preis = Number(i.price);
          if(Number.isFinite(preis)) item.p = preis;
        }
        return item;
      });

    const wochenkarte = daten?.karten?.wochenkarte;
    const aperitivo = wochenkarte?.sections?.find(s => textNorm(s.label) === 'aperitivo');
    const aperitivoZiel = SPECIALE.find(c => c.id === 'sp-drinks');
    let geaendert = false;
    if(aperitivo && Array.isArray(aperitivo.items) && aperitivoZiel){
      aperitivoZiel.items = gerichte({sections:[aperitivo]});
      geaendert = true;
    }

    const mittagskarte = daten?.karten?.mittagstisch;
    if(mittagskarte){
      MITTAG.von = mittagskarte.from || '';
      MITTAG.bis = mittagskarte.to || '';
      MITTAG.items = gerichte(mittagskarte);
      const fuss = mittagskarte.footnote || '';
      MITTAG.hinweis = {de:fuss, en:Woerterbuch.uebersetzen(fuss)};
      geaendert = true;
    }
    if(geaendert) render(true);
  }catch(e){
    /* Die bisherigen Einträge bleiben sichtbar, falls menu.json nicht erreichbar ist. */
  }
}
/* ---- Speisekarte ---- */
function match(it){
  if (filter === 'vito' && !it.v) return false;
  if (!query) return true;
  const hay = [L(it.name), it.de, it.en, it.n].join(' ').toLowerCase();
  return query.toLowerCase().split(/\s+/).every(w => hay.includes(w));
}
function renderKarte(){
  const u = UI[lang], I = u.intro;
  let h = `${hero('banner-speisekarte.webp', u.karteTitle)}${lang==='en' ? `<div class="panel-head"><div class="kicker">${u.karteTitle}</div></div>` : ''}`;
  if (!query && filter === 'all'){
    h += `<div class="intro-card"><blockquote>„${I.quote}“</blockquote><cite>Theodore Zeldin</cite>
      <p style="text-align:center;margin-top:12px">${I.lead}</p>
      <details><summary>${I.moreLbl}</summary>
        <h4>${I.h1}</h4><p>${I.p1}</p><h4>${I.h2}</h4><p>${I.p2}</p><p style="margin-top:8px">${I.p3}</p>
        <p class="sign">${I.sign}</p><p>${I.sign2}</p></details></div>`;
  }
  if (filter === 'vito' || (!query && filter === 'all')) h += `<div class="vito-box"><b>Vito's Selezione</b><p>${u.vitoTxt}</p></div>`;
  h += `<div class="search"><input id="q" type="search" placeholder="${u.search}" value="${esc(query)}" autocomplete="off"><button id="qx" aria-label="clear" class="${query?'':'hidden'}">×</button></div>`;
  let any = false;
  for (const c of KARTE){
    const items = c.items.filter(match);
    if (!items.length) continue;
    any = true;
    const full = !query && filter === 'all';
    h += `<section class="cat" id="${c.id}">${full && c.img ? `<figure class="cat-img"><img src="${IMG}${c.img}" alt="" loading="lazy" style="object-position:${c.pos||'50% 50%'}"></figure>` : ''}<div class="cat-title"><h2>${esc(c.it)}</h2>${L(c.t) !== c.it ? `<span>${esc(L(c.t))}</span>` : ''}</div>
      ${full && c.intro ? `<p class="cat-intro">${esc(L(c.intro))}</p>` : ''}
      ${items.map(i => itemHTML(i)).join('')}
      ${full ? notesHTML(c) : ''}
      ${full && c.foot ? `<p class="foot-small">${esc(L(c.foot))}</p>` : ''}</section>`;
  }
  if (!any) h += `<div class="empty">${u.none}</div>`;
  h += `<div class="note" style="margin-top:28px">${u.allergy}</div><p class="foot-small">${u.fine}</p>`;
  return h;
}

/* ---- Chips ---- */
function renderChips(){
  const chips = $('#chips');
  if (tab === 'mittag'){ chips.classList.add('hidden'); return; }
  chips.classList.remove('hidden');
  if (!render.keep) chips.scrollLeft = 0;
  if (tab === 'speciale'){
    chips.innerHTML = SPECIALE.map(c => `<button class="chip" data-jump="${c.id}">${esc(L(c.t))}</button>`).join('');
  } else {
    chips.innerHTML = `<button class="chip ${filter==='all'&&!query?'on':''}" data-filter="all">${UI[lang].all}</button>
      <button class="chip vito ${filter==='vito'?'on':''}" data-filter="vito">${UI[lang].vito}</button>` +
      KARTE.map(c => `<button class="chip" data-jump="${c.id}">${esc(c.it)}</button>`).join('');
  }
}

function render(keepScroll){
  render.keep = keepScroll;
  document.documentElement.lang = lang;
  document.querySelectorAll('.lang-toggle button').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === lang));
  document.querySelectorAll('.tab').forEach(b => { b.textContent = UI[lang].tabs[b.dataset.tab]; b.setAttribute('aria-selected', b.dataset.tab === tab); });
  $('#main').innerHTML = tab === 'mittag' ? renderMittag() : tab === 'speciale' ? renderSpeciale() : renderKarte();
  renderChips();
  $('#pop-go').textContent = UI[lang].popClose; $('#f-call').textContent = UI[lang].call; $('#f-map').textContent = UI[lang].map; $('#f-fine').textContent = UI[lang].fine; $('#f-imp').textContent = UI[lang].imp; $('#f-ds').textContent = UI[lang].ds; $('#f-img').textContent = UI[lang].imgNote;
  if (!keepScroll) window.scrollTo({top:0, behavior:'instant'});
  bindSearch(); spy();
}

function bindSearch(){
  const q = $('#q'); if (!q) return;
  q.addEventListener('input', e => {
    query = e.target.value.trim();
    const pos = q.selectionStart;
    render(true);
    const n = $('#q'); n.focus(); n.setSelectionRange(pos, pos);
  });
  $('#qx').addEventListener('click', () => { query = ''; render(true); });
}

/* Scrollspy für Chips */
let spyObs;
function spy(){
  if (spyObs) spyObs.disconnect();
  const secs = document.querySelectorAll('section.cat[id]');
  if (!secs.length || !('IntersectionObserver' in window)) return;
  spyObs = new IntersectionObserver(ents => {
    ents.forEach(en => {
      if (!en.isIntersecting) return;
      document.querySelectorAll('.chip[data-jump]').forEach(c => {
        const on = c.dataset.jump === en.target.id;
        c.classList.toggle('on', on);
        if (on){ const bar = c.parentElement; bar.scrollTo({left: c.offsetLeft - bar.clientWidth/2 + c.clientWidth/2, behavior:'smooth'}); }
      });
    });
  }, {rootMargin:'-45% 0px -50% 0px'});
  secs.forEach(s => spyObs.observe(s));
}

function setLang(l){ lang = l; document.documentElement.lang = l; render(true); }
function setTab(t){ tab = t; filter = 'all'; query = ''; history.replaceState(null, '', '#' + t); render(); }

document.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.closest('.lang-toggle')) return setLang(b.dataset.lang);
  if (b.dataset.tab) return setTab(b.dataset.tab);
  if (b.dataset.filter){ filter = b.dataset.filter; query = ''; render(); return; }
  if (b.dataset.jump){ document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth'}); return; }
  if (b.dataset.more){ const t = document.getElementById(b.dataset.more); const open = t.classList.toggle('hidden'); b.textContent = open ? UI[lang].more : UI[lang].less; }
});

/* ---------- POPUP ----------
   Bild als  popup.jpg  in denselben Ordner wie diese Datei legen.
   Liegt keine Datei dort, erscheint kein Popup.
   Das Popup erscheint bei jedem Öffnen der App. */
const POPUP_FILES = ['popup.jpg','popup.jpeg','popup.png','popup.webp','popup.JPG','popup.JPEG','popup.PNG','Popup.jpg','Popup.png'];

function openPopup(){
  const img = $('#pop-img');
  const bust = location.protocol.startsWith('http') ? '?v=' + Date.now() : '';
  let i = 0;
  const tryNext = () => {
    if (i >= POPUP_FILES.length){ console.info('[Popup] Kein Bild gefunden (' + POPUP_FILES.join(', ') + ') – Popup bleibt aus.'); return; }
    const file = POPUP_FILES[i++];
    img.onload = () => {
      console.info('[Popup] angezeigt: ' + file);
      $('#popup').classList.add('show');
    };
    img.onerror = tryNext;
    img.src = file + bust;
  };
  tryNext();
}
function closePopup(){ $('#popup').classList.remove('show'); }
$('#pop-x').addEventListener('click', closePopup);
$('#pop-go').addEventListener('click', closePopup);
$('#popup').addEventListener('click', e => { if (e.target.id === 'popup') closePopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closePopup(); });

/* Start
   Sprache: immer Deutsch beim Öffnen. Nur ?lang=en im Link startet auf Englisch.
   Umschalten per DE/EN oben gilt für den aktuellen Besuch.
   Bereich: #mittag | #speciale | #karte */
(function init(){
  const params = new URLSearchParams(location.search);
  const h = location.hash.replace('#','');
  if (['mittag','speciale','karte'].includes(h)) tab = h;
  lang = params.get('lang') === 'en' ? 'en' : 'de';
  document.documentElement.lang = lang;
  render();
  openPopup();
  studioKartenLaden();
})();
</script>
