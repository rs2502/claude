<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wochenkarte · Ristorante Da Mimmo</title>
<meta name="description" content="Die aktuelle Wochenkarte im Ristorante Da Mimmo, Delmenhorst.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=Dancing+Script:wght@500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="karte.css?v=161">

<style>
  body{background:#f2efe6;padding:0}
  .gaeste{display:flex;justify-content:center;padding:20px 12px 50px}
  .blatt{width:100%;max-width:210mm;min-height:0;flex-shrink:1;box-shadow:0 24px 60px rgba(0,0,0,.6)}
  @media (max-width:640px){
    .blatt{padding:22px 16px 26px}
    .blatt::after{inset:9px}
    .karte-kopf .logo-bild{height:46px}
    .karte-kopf .adresse{font-size:13px}
    .wochen-band .titel{font-size:34px;letter-spacing:.04em}
    .wochen-datum .spanne{font-size:25px}
    .wochen-datum .strich{flex-basis:26px}
    .wochen-band .zeitraum{font-size:12px}
    .gang-titel{font-size:17px}
    .speise{grid-template-columns:34px 1fr auto;gap:9px}
    .speise-symbol{width:28px;height:28px}
    .speise-name{font-size:17px}
    .speise-desc{font-size:13.5px}
    .speise-preis{font-size:17px;padding-left:10px}
    .karte-claim{font-size:34px;margin-left:6px;max-width:220px}
    .karte-ruf{font-size:14px;padding:11px 14px;gap:8px}
    .karte-ruf svg{width:17px;height:17px}
    .karte-ruf .trenner{margin:0 2px}
    .karte-fuss{font-size:13px}
  }
  @media print{ .gaeste-wahl{display:none} body{background:#fff} .blatt{box-shadow:none} }
  .fehler{color:#C8B9A3;font-family:Inter,sans-serif;text-align:center;padding:60px 20px;line-height:1.7}

  /* Helle Extrakarte nach der Referenzvorlage; vorhandene Schriftgrade bleiben unverändert. */
  .blatt.extra-referenz{background-image:none!important;background-color:#f8f6ed;color:#252319;box-shadow:none}
  .blatt.extra-referenz::before{background:none}
  .blatt.extra-referenz::after{
    inset:6mm;border:1pt solid #625e49;
    box-shadow:inset 0 0 0 3px #f8f6ed,inset 0 0 0 4px #8c866b;
    background:
      radial-gradient(circle at 0 0,#625e49 0 1px,transparent 1.5px),
      radial-gradient(circle at 100% 0,#625e49 0 1px,transparent 1.5px),
      radial-gradient(circle at 0 100%,#625e49 0 1px,transparent 1.5px),
      radial-gradient(circle at 100% 100%,#625e49 0 1px,transparent 1.5px);
  }
  .blatt.extra-referenz .wochen-band{display:none}
  .blatt.extra-referenz .gang-titel{color:#625e49}
  .blatt.extra-referenz .gang-titel .zier,
  .blatt.extra-referenz .gang-titel .zier:last-child{background:linear-gradient(90deg,transparent,#91896d,transparent)}
  .blatt.extra-referenz .gang-titel .zier::after{background:#756e54}
  .blatt.extra-referenz .trennlinie{position:relative;background:linear-gradient(90deg,transparent,#928a6d,transparent)}
  .blatt.extra-referenz .trennlinie::after{content:'';position:absolute;left:50%;top:50%;width:4px;height:4px;background:#756e54;transform:translate(-50%,-50%) rotate(45deg)}
  .blatt.extra-referenz .speise-z-kopf{font-family:'Cormorant Garamond',Georgia,serif}
  .blatt.extra-referenz .speise-z-desc{font-family:'Cormorant Garamond',Georgia,serif}
  .blatt.extra-referenz .dessert-hinweis{margin-top:calc(8mm * var(--s));margin-bottom:calc(8mm * var(--s))}
  .blatt.extra-referenz .dessert-hinweis .gang-titel{display:none}
  .qr-speisekarte{display:flex;justify-content:center;margin:calc(3mm * var(--s)) auto 0}
  .qr-speisekarte img{display:block;width:28mm;height:auto}
  .preis-hinweis{text-align:center;margin-top:calc(2mm * var(--s))}

  /* Logo unten neben der Telefonnummer */
  .karte-fuss:has(.fuss-marke){
    display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
    gap:calc(5mm * var(--s)) calc(6mm * var(--s));
  }
  .karte-fuss:has(.fuss-marke) .hinweise{flex:1 0 100%}
  .fuss-marke .logo-bild{height:calc(13mm * var(--s));width:auto;display:block}
  .karte-fuss:has(.fuss-marke) .karte-ruf{margin:0}

  .legende-merkmale{
    display:flex;justify-content:center;gap:1.6em;flex-wrap:wrap;
    margin:calc(4mm * var(--s)) 0 0;font-size:calc(9.5pt * var(--s));color:#B7AB99;
  }
  .stil-hell .legende-merkmale, .stil-weiss .legende-merkmale{color:#574E43}
  @media (max-width:640px){ .legende-merkmale{font-size:12.5px} }

  /* Merkmale (vegetarisch, laktosefrei) */
  .merkmal{width:1em;height:1em;vertical-align:-0.12em;margin-left:.4em;color:inherit;opacity:.85}

  /* Mittiges Layout wie auf der Vorlage */
  .layout-zentriert .gang-z{margin-bottom:calc(5mm * var(--s))}
  .layout-zentriert .trennlinie{
    height:1.2px;margin:calc(5mm * var(--s)) auto;width:92%;
    background:linear-gradient(90deg,transparent,rgba(224,180,99,.55),transparent);
  }
  .layout-zentriert.stil-hell .trennlinie,
  .layout-zentriert.stil-weiss .trennlinie{
    background:linear-gradient(90deg,transparent,rgba(122,71,16,.5),transparent);
  }
  .speise-z{text-align:center;margin-bottom:calc(4.5mm * var(--s))}
  .speise-z-kopf{
    font-family:"Gill Sans","Gill Sans MT","Gill Sans Nova",Lato,var(--sans);
    font-weight:500;letter-spacing:.05em;text-transform:uppercase;
    font-size:9.5pt;color:#FFFFFF;line-height:1.35;
  }
  .speise-z-kopf .punkt{margin:0 .45em;color:#E0B463}
  .speise-z-kopf .preis{color:#E0B463;letter-spacing:.02em}
  .speise-z-desc{
    white-space:pre-line;   /* eigene Umbrüche gelten */
    font-family:"Gill Sans","Gill Sans MT","Gill Sans Nova",Lato,var(--sans);
    font-size:8pt;line-height:1.45;color:#CFC3B0;
    max-width:92%;margin:calc(1.2mm * var(--s)) auto 0;
    text-wrap:balance;   /* lange Weinbeschreibungen bleiben vollständig */
  }
  .stil-hell .speise-z-kopf, .stil-weiss .speise-z-kopf{color:#161210}
  .stil-hell .speise-z-kopf .punkt, .stil-weiss .speise-z-kopf .punkt,
  .stil-hell .speise-z-kopf .preis, .stil-weiss .speise-z-kopf .preis{color:#7A4710}
  .stil-hell .speise-z-desc, .stil-weiss .speise-z-desc{color:#574E43}
  @media (max-width:640px){
    .speise-z-kopf{font-size:15px}
    .speise-z-desc{font-size:13.5px}
  }

  /* Umschalter oben: Karte und Sprache */
  .gaeste-wahl{
    display:flex;flex-wrap:wrap;justify-content:center;gap:10px;
    padding:16px 12px 0;font-family:Poppins,Inter,sans-serif;
  }
  .gaeste-wahl .gruppe{
    display:flex;gap:4px;background:rgba(255,255,255,.05);
    border:1px solid rgba(214,171,96,.3);border-radius:999px;padding:4px;
  }
  .gaeste-wahl button{
    font:inherit;font-size:13px;font-weight:500;letter-spacing:.03em;
    padding:8px 16px;border:0;border-radius:999px;cursor:pointer;
    background:transparent;color:#C8B9A3;
  }
  .gaeste-wahl button.an{background:rgba(214,171,96,.22);color:#EFD9A6}
  @media (max-width:640px){ .gaeste-wahl button{padding:9px 13px;font-size:12.5px} }

  /* Hinweise immer genau zwei Zeilen */
  .hinweise .zeile{display:block;white-space:nowrap}
  @media (max-width:640px){ .karte-fuss .hinweise{padding-left:6px;padding-right:6px} }
</style>

<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <linearGradient id="goldVerlauf" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#E7C176"/><stop offset="22%" stop-color="#C98B3A"/>
    <stop offset="45%" stop-color="#8C4E17"/><stop offset="68%" stop-color="#D8A44F"/>
    <stop offset="100%" stop-color="#E9C87F"/>
  </linearGradient>
</defs></svg>

<nav class="gaeste-wahl" id="gaesteWahl" hidden>
  <div class="gruppe" id="kartenWahl"></div>
  <div class="gruppe" id="sprachWahl">
    <button type="button" data-sprache="de" class="an">Deutsch</button>
    <button type="button" data-sprache="en">English</button>
  </div>
</nav>

<div class="gaeste">
  <article class="blatt stil-klassisch" id="blatt"><div class="fehler">Karte wird geladen …</div></article>
</div>

<script>
let studio = null, aktiv = 'wochenkarte', sprache = 'de';
const EN = ()=> sprache === 'en';
const TEXTE = {
  de:{ getraenke:'Empfohlene Getränke', hinweis:'WICHTIGE HINWEISE:',
       bis:'bis', karte:{wochenkarte:'Extra Karte', mittagstisch:'Mittagstisch'} },
  en:{ getraenke:'Recommended Drinks',  hinweis:'PLEASE NOTE:',
       bis:'to', karte:{wochenkarte:'Specials', mittagstisch:'Lunch Menu'} },
};
const T = k => TEXTE[EN()?'en':'de'][k];
const eng = (deutsch, eigene)=>{
  if(!EN()) return deutsch;
  if(eigene && eigene.trim()) return eigene.trim();
  return Woerterbuch.uebersetzen(deutsch||'');
};

const esc = s => String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
/* Schreibweise wie auf der Vorlage: ohne €-Zeichen, ohne Null am Ende */
const preis = p => (p==null||p==='') ? '' :
  Number(p).toLocaleString('de-DE',{minimumFractionDigits:0,maximumFractionDigits:2});

const tagName = t => { const x=new Date(t+'T12:00:00');
  return isNaN(x)?'':x.toLocaleDateString(EN()?'en-GB':'de-DE',{weekday:'long'}); };

/* Überschrift eines Blocks, englisch über das Wörterbuch */
function blockTitel(s){
  const roh = (s.label||'').trim();
  if(!roh) return '';
  if(!EN()) return roh;
  if(s.labelEn && s.labelEn.trim()) return s.labelEn.trim();
  return Woerterbuch.uebersetzen(roh);
}

function spanneText(d){
  if(EN()){
    const lang = x=> x.toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
    const a = d.from ? new Date(d.from+'T12:00:00') : null;
    const b = d.to   ? new Date(d.to+'T12:00:00')   : null;
    if(a && b && !isNaN(a) && !isNaN(b))
      return (a.getMonth()===b.getMonth() && a.getFullYear()===b.getFullYear())
        ? `${a.getDate()} – ${lang(b)}` : `${lang(a)} – ${lang(b)}`;
    const eins = a || b;
    return eins && !isNaN(eins) ? lang(eins) : '';
  }
  const kurz = t => { const x=new Date(t+'T12:00:00');
    return isNaN(x)?'':x.toLocaleDateString('de-DE'); };
  if(d.from && d.to){
    const a=new Date(d.from+'T12:00:00'), b=new Date(d.to+'T12:00:00');
    if(!isNaN(a)&&!isNaN(b)&&a.getFullYear()===b.getFullYear()){
      const tm = x => String(x.getDate()).padStart(2,'0')+'.'+String(x.getMonth()+1).padStart(2,'0');
      return `${tm(a)}. – ${tm(b)}.${b.getFullYear()}`;
    }
    return `${kurz(d.from)} – ${kurz(d.to)}`;
  }
  return kurz(d.from||d.to||'');
}

function zeichnen(d){
  const blatt = document.getElementById('blatt');
  const extraReferenz = aktiv === 'wochenkarte' && /extra/i.test(String(d.title||''));
  blatt.className = 'blatt ' + (d.stil||'stil-klassisch') + (d.layout === 'zentriert' ? ' layout-zentriert' : '') + (extraReferenz ? ' extra-referenz' : '');
  blatt.style.backgroundImage = `url('bilder/${d.hintergrund || 'hintergrund.jpeg'}')`;
  const r = d.restaurant||{};

  const marke = `<img class="logo-bild" src="${esc(d.logo || 'bilder/Logo-schrift.png')}"
    alt="${esc(r.name||'Da Mimmo')}">`;

  const adresse = d.adresseZeigen === false ? '' :
    [r.street,r.city].filter(Boolean).map(t=>`<span>${esc(t)}</span>`).join(' ');

  const preisHinweis = (d.sections||[])
    .filter(s=>/preishinweis/i.test(String(s.label||'')))
    .flatMap(s=>s.items||[]).map(i=>i.desc).find(Boolean)
    || 'Alle Preise in € inklusive Mehrwertsteuer und Dienstleistung, vorbehaltlich von Änderungen';

  const va=tagName(d.from||''), bis=tagName(d.to||'');
  const wochentage = d.tageZeigen === false ? ''
    : ((va&&bis&&va!==bis) ? `${va} ${T('bis')} ${bis}` : (va||bis||''));
  const spanne = d.datumZeigen === false ? '' : spanneText(d);

  const zentriert = d.layout === 'zentriert';

  const gaenge = (d.sections||[]).filter(s=>!(/preishinweis/i.test(String(s.label||'')))).map((s,si)=>{
    const gerichte = (s.items||[]).filter(i=>i.name||i.desc);
    if(!gerichte.length) return '';
    const titel = blockTitel(s);
    if(zentriert){
      const dessertHinweis = /dessert/i.test(String(s.label||'')) ? ' dessert-hinweis' : '';
      return `${si ? '<div class="trennlinie"></div>' : ''}
        <section class="gang-z${dessertHinweis}">
        ${titel?`<div class="gang-titel kommt"><span class="zier"></span><span>${esc(titel)}</span><span class="zier"></span></div>`:''}
        ${gerichte.map(i=>`<div class="speise-z kommt">
            <div class="speise-z-kopf">${esc(eng(i.name||'', i.nameEn))}${(i.merkmale||[]).map(m=>merkmalSVG(m,'merkmal')).join('')}${
              i.price!=null && i.price!=='' ? `<span class="punkt">·</span><span class="preis">${preis(i.price)}</span>` : ''}</div>
            ${i.desc?`<div class="speise-z-desc">${esc(eng(i.desc, i.descEn))}</div>`:''}
          </div>`).join('')}
      </section>`;
    }
    return `<section class="gang${s.rahmen?' rahmen':''}">
      ${titel?`<div class="gang-titel kommt"><span class="zier"></span><span>${esc(titel)}</span><span class="zier"></span></div>`:''}
      ${gerichte.map(i=>{
        const symbol = d.symbole === false
          ? '<span class="speise-symbol"></span>'
          : symbolSVG(symbolFuer(s.label, i));
        return `<div class="speise kommt">
          ${symbol}
          <div class="speise-text">
            <div class="speise-name">${esc(eng(i.name||'', i.nameEn))}${(i.merkmale||[]).map(m=>merkmalSVG(m,'merkmal')).join('')}</div>
            ${i.desc?`<div class="speise-desc">${esc(eng(i.desc, i.descEn))}</div>`:''}
          </div>
          <div class="speise-preis">${preis(i.price)}</div>
        </div>`;
      }).join('')}
    </section>`;
  }).join('');

  blatt.innerHTML = `
    <header class="karte-kopf">
      ${d.logoZeigen !== false ? `<div class="karte-marke">${marke}</div>` : ''}
      ${adresse?`<div class="adresse">${adresse}</div>`:''}
    </header>
    <div class="wochen-band">
      <span class="titel">${esc(kartenTitel(d))}</span>
      ${spanne?`<div class="wochen-datum">
        <span class="strich"></span><span class="spanne">${esc(spanne)}</span><span class="strich"></span>
      </div>`:''}
      ${wochentage?`<div class="zeitraum">${esc(wochentage)}</div>`:''}
    </div>
    ${d.intro?`<p class="karte-intro">${esc(eng(d.intro,d.introEn))}</p>`:''}
    <div>${gaenge}</div>
    ${(()=>{ const benutzt=[]; (d.sections||[]).forEach(s=>(s.items||[]).forEach(i=>(i.merkmale||[]).forEach(m=>{ if(!benutzt.includes(m)) benutzt.push(m); })));
      return benutzt.length ? `<div class="legende-merkmale">${benutzt.map(m=>
        `<span>${merkmalSVG(m,'merkmal')} ${esc(EN()?Woerterbuch.uebersetzen((MERKMALE[m]||{}).name||m):((MERKMALE[m]||{}).name||m))}</span>`).join('')}</div>` : ''; })()}
    ${d.fusszeile === false ? '' : `<footer class="karte-fuss">
      ${d.footnote?(()=>{ const zeilen = hinweisZeilen(hinweisText(d));
        return `<div class="hinweise">${zeilen.map((z,i)=>
          `<span class="zeile">${i===0?`<b>${esc(T('hinweis'))}</b> `:''}${esc(z)}</span>`).join('')}</div>`; })():''}
      ${d.qrZeigen === true ? `<div class="qr-speisekarte"><img src="bilder/qr-code-speisekarte-kompakt.png" alt="QR-Code zur Speisekarte" loading="lazy"></div>` : ''}
      <div class="preis-hinweis">${esc(EN()?'All prices include VAT and service. Prices are subject to change.':preisHinweis)}</div>
    </footer>`}`;
  if(r.name) document.title = `${kartenTitel(d)} · ${r.name}`;
  titelEinpassen(); hinweiseEinpassen();
  einblenden();
}

/* Die Überschrift füllt die Blattbreite — wie auf der Vorlage. */
function titelEinpassen(){
  const el = document.querySelector('.wochen-band .titel');
  const blatt = document.getElementById('blatt');
  if(!el || !blatt) return;
  const stil = getComputedStyle(blatt);
  const innen = blatt.clientWidth
              - parseFloat(stil.paddingLeft) - parseFloat(stil.paddingRight);
  const ziel = innen * 0.94;
  el.style.fontSize = '';
  let gr = parseFloat(getComputedStyle(el).fontSize);
  for(let runde=0; runde<8; runde++){
    const breite = el.getBoundingClientRect().width;
    if(!breite) break;
    if(Math.abs(breite-ziel)/ziel < 0.015) break;
    gr = Math.max(16, Math.min(200, gr * ziel/breite));
    el.style.fontSize = gr.toFixed(1)+'px';
  }
}
addEventListener('resize', titelEinpassen);

/* Hinweise: Schrift verkleinern, bis beide Zeilen hineinpassen */
function hinweiseEinpassen(){
  const h = document.querySelector('.hinweise'); if(!h) return;
  h.style.fontSize = '';
  let gr = parseFloat(getComputedStyle(h).fontSize);
  while(h.scrollWidth > h.clientWidth && gr > 8){ gr -= 0.25; h.style.fontSize = gr+'px'; }
}
addEventListener('resize', hinweiseEinpassen);

/* Hinweise in zwei Zeilen (wie in social.js) */
function hinweisZeilen(text){
  const t = String(text||'').trim();
  if(t.includes('\n')) return t.split('\n').map(z=>z.trim()).filter(Boolean);
  const saetze = t.match(/[^.!?]+[.!?]+|[^.!?]+$/g) || [t];
  if(saetze.length < 2) return [t];
  return [saetze.slice(0,-1).join('').trim(), saetze[saetze.length-1].trim()];
}

/* Gerichte erscheinen, sobald sie ins Bild kommen. */
function einblenden(){
  const teile = document.querySelectorAll('.kommt');
  if(!('IntersectionObserver' in window)){
    teile.forEach(t=> t.classList.add('da')); return;
  }
  const beobachter = new IntersectionObserver(eintraege=>{
    eintraege.forEach((e,n)=>{
      if(!e.isIntersecting) return;
      setTimeout(()=> e.target.classList.add('da'), n*70);
      beobachter.unobserve(e.target);
    });
  },{threshold:0});
  requestAnimationFrame(()=> teile.forEach(t=> beobachter.observe(t)));
  setTimeout(()=>{
    document.querySelectorAll('.kommt:not(.da)').forEach(t=>{
      if(t.getBoundingClientRect().top < innerHeight) t.classList.add('da');
    });
  },1000);
}

/* Überschrift und Hinweise der gewählten Karte, in der gewählten Sprache */
function kartenTitel(d){
  const standard = TEXTE[EN()?'en':'de'].karte[aktiv];
  if(!EN()) return d.title || standard;
  if(d.titleEn && d.titleEn.trim()) return d.titleEn.trim();
  const istStandard = ['wochenkarte','extra karte','mittagstisch'].includes(String(d.title||'').trim().toLowerCase());
  return istStandard || !d.title ? standard : Woerterbuch.uebersetzen(d.title);
}
function hinweisText(d){
  const roh = d.footnote || '';
  if(!EN()) return roh;
  if(d.footnoteEn && d.footnoteEn.trim()) return d.footnoteEn.trim();
  return roh.split('\n').map(zeile=>
    zeile.split(/(\s·\s)/).map(teil=>
      teil.trim() && teil !== ' · '
        ? teil.replace(/\.\s+/g,'.\n').split('\n').map(satz=> Woerterbuch.uebersetzen(satz)).join(' ')
        : teil).join('')).join('\n');
}

function gefuellt(k){
  return !!(k && (k.sections||[]).some(s=> (s.items||[]).some(i=> i.name || i.desc)));
}

function anzeigen(){
  zeichnen(studio.karten[aktiv]);
  document.querySelectorAll('#kartenWahl button').forEach(b=>
    b.classList.toggle('an', b.dataset.karte === aktiv));
  document.querySelectorAll('#sprachWahl button').forEach(b=>
    b.classList.toggle('an', b.dataset.sprache === sprache));
}

function wahlAufbauen(){
  const vorhanden = ['wochenkarte','mittagstisch'].filter(k=> gefuellt(studio.karten[k]));
  const nav = document.getElementById('gaesteWahl');
  const ziel = document.getElementById('kartenWahl');
  ziel.innerHTML = vorhanden.length > 1
    ? vorhanden.map(k=>`<button type="button" data-karte="${k}">${TEXTE[EN()?'en':'de'].karte[k]}</button>`).join('')
    : '';
  nav.hidden = false;
}

/* Ein Klick-Empfänger für beide Reihen, einmal gesetzt */
document.getElementById('gaesteWahl').addEventListener('click', e=>{
  const k = e.target.closest('button[data-karte]');
  const s = e.target.closest('button[data-sprache]');
  if(k) aktiv = k.dataset.karte;
  else if(s){ sprache = s.dataset.sprache; document.documentElement.lang = sprache; wahlAufbauen(); }
  else return;
  anzeigen();
  scrollTo({top:0, behavior:'smooth'});
});

function starten(roh){
  studio = roh && roh.karten ? roh
         : { karten:{ wochenkarte: roh, mittagstisch:null } };
  if(!gefuellt(studio.karten[aktiv])){
    const anderer = ['wochenkarte','mittagstisch'].find(k=> gefuellt(studio.karten[k]));
    if(anderer) aktiv = anderer;
  }
  /* Die Sprache im Studio ist nur dessen Vorschau — Gäste starten immer auf Deutsch. */
  wahlAufbauen();
  anzeigen();
}

fetch('menu.json',{cache:'no-store'})
  .then(a=>{ if(!a.ok) throw new Error('menu.json fehlt'); return a.json(); })
  .then(starten)
  .catch(()=>{
    try{
      const neu = localStorage.getItem('damimmo.studio.v2');
      if(neu) return starten(JSON.parse(neu));
      const alt = localStorage.getItem('damimmo.karte.v1');
      if(alt) return starten(JSON.parse(alt));
    }catch(e){}
    document.getElementById('blatt').innerHTML =
      '<div class="fehler">Die Wochenkarte konnte nicht geladen werden.<br>Bitte später noch einmal versuchen.</div>';
  });
</script>
</body>
</html>
