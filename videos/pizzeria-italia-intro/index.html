<!doctype html>
<html lang="de" data-resolution="portrait">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="vendor/gsap.min.js"></script>
    <style>
      @font-face {
        font-family: "Pacifico";
        src: url("fonts/pacifico.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
      }
      /* Palette: cream canvas, espresso ink, tomato accent, basil + white-wine gold supports */
      :root {
        --bg: #fff3dc;
        --ink: #2b1a12;
        --tomato: #c62a1b;
        --basil: #1f7a34;
        --gold: #f2b233;
        --shell: #262b45;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: radial-gradient(circle at 50% 58%, #ffe3b0 0%, var(--bg) 62%);
        font-family: "Archivo Black", sans-serif;
        color: var(--ink);
      }
      .layer {
        position: absolute;
        inset: 0;
      }

      /* Background: gingham tablecloth bands, ghost word, floating decor */
      .gingham {
        position: absolute;
        left: -120px;
        width: 1320px;
        height: 130px;
        background-color: #fff;
        background-image:
          linear-gradient(90deg, rgba(198, 42, 27, 0.55) 50%, transparent 50%),
          linear-gradient(0deg, rgba(198, 42, 27, 0.55) 50%, transparent 50%);
        background-size: 60px 60px;
      }
      #gingham-top {
        top: 0;
      }
      #gingham-bottom {
        bottom: 0;
      }
      #ghost {
        position: absolute;
        left: -40px;
        top: 760px;
        font-size: 420px;
        line-height: 1;
        letter-spacing: -0.04em;
        color: var(--tomato);
        opacity: 0.12;
        white-space: nowrap;
      }
      .deco {
        position: absolute;
      }

      /* Brand lockup */
      #brand {
        position: absolute;
        left: 0;
        right: 0;
        top: 190px;
        text-align: center;
        transform-origin: 50% 50%;
      }
      #brand-label {
        margin-bottom: 48px;
        font-size: 44px;
        letter-spacing: 0.32em;
        color: var(--tomato);
        padding-left: 0.32em;
      }
      #brand-pizzeria {
        font-family: "Pacifico", cursive;
        font-size: 150px;
        line-height: 1.35;
        color: var(--basil);
        margin-top: 0;
      }
      #brand-italia {
        font-size: 200px;
        line-height: 1;
        letter-spacing: -0.03em;
        color: var(--tomato);
      }
      #tricolore {
        display: flex;
        justify-content: center;
        gap: 0;
        margin: 26px auto 0;
        width: 420px;
        height: 18px;
        border-radius: 9px;
        overflow: hidden;
      }
      #tricolore span {
        flex: 1;
        transform-origin: 0 50%;
      }

      /* "Ab sofort" stamp */
      #stamp {
        position: absolute;
        left: 44px;
        top: 168px;
        width: 220px;
        height: 220px;
        border-radius: 50%;
        background: var(--tomato);
        color: #fff;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-size: 44px;
        line-height: 1.02;
        text-align: center;
        box-shadow: 0 0 0 10px #fff, 0 0 0 16px var(--tomato);
      }

      /* Headline */
      #headline {
        position: absolute;
        left: 0;
        right: 0;
        top: 770px;
        text-align: center;
        font-size: 104px;
        line-height: 1;
        letter-spacing: -0.03em;
      }
      #headline .word {
        display: inline-block;
      }
      #swoosh {
        position: absolute;
        left: 50%;
        top: 890px;
        width: 620px;
        height: 40px;
        margin-left: -310px;
      }

      /* Plates */
      .plate {
        position: absolute;
        top: 990px;
        width: 500px;
        height: 500px;
      }
      #plate-wine {
        left: 30px;
      }
      #plate-tomato {
        right: 30px;
      }
      .pill {
        position: absolute;
        top: 1500px;
        padding: 18px 30px 22px;
        border-radius: 60px;
        font-size: 40px;
        line-height: 1;
        white-space: nowrap;
      }
      #pill-wine {
        left: 44px;
        background: var(--gold);
        color: var(--ink);
      }
      #pill-tomato {
        right: 44px;
        background: var(--tomato);
        color: #fff;
      }
      .steam {
        position: absolute;
        top: 900px;
        width: 200px;
        height: 110px;
      }
      #steam-wine {
        left: 180px;
      }
      #steam-tomato {
        right: 180px;
      }

      /* Closing line */
      #appetito {
        position: absolute;
        left: 0;
        right: 0;
        top: 1600px;
        text-align: center;
        font-family: "Pacifico", cursive;
        font-size: 124px;
        line-height: 1.2;
        color: var(--basil);
      }
    </style>
  </head>

    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      // --- Ambient background (runs the whole 10s) ---
      tl.fromTo("#gingham-top", { x: 0 }, { x: -60, duration: 10, ease: "none" }, 0);
      tl.fromTo("#gingham-bottom", { x: -60 }, { x: 0, duration: 10, ease: "none" }, 0);
      tl.fromTo("#ghost", { x: 60 }, { x: -140, duration: 10, ease: "none" }, 0);
      tl.fromTo("#deco-leaf-a", { rotation: -10, y: 0 }, { rotation: 18, y: -30, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#deco-leaf-b", { rotation: 12, y: 0 }, { rotation: -16, y: -26, duration: 5, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
      tl.fromTo("#deco-tom-a", { y: 0, scale: 1 }, { y: 24, scale: 1.08, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 3 }, 0);
      tl.fromTo("#deco-tom-b", { y: 0 }, { y: -20, duration: 2, ease: "sine.inOut", yoyo: true, repeat: 4 }, 0);

      // --- 0.0–1.6s: brand lockup lands center, then docks to the top ---
      tl.set("#brand", { y: 520, scale: 1.18, rotation: 0 }, 0);
      tl.from("#brand-label", { opacity: 0, y: -40, duration: 0.45, ease: "power3.out" }, 0.1);
      tl.from("#brand-pizzeria", { opacity: 0, scale: 0.4, rotation: -8, duration: 0.6, ease: "back.out(2.2)" }, 0.25);
      tl.from("#brand-italia", { opacity: 0, y: 90, scaleY: 0.3, duration: 0.55, ease: "elastic.out(1, 0.55)" }, 0.45);
      tl.from("#tricolore span", { scaleX: 0, duration: 0.3, ease: "power2.out", stagger: 0.1 }, 0.75);
      tl.to("#brand", { y: 0, scale: 0.86, duration: 0.7, ease: "expo.inOut" }, 1.2);
      tl.fromTo("#brand", { rotation: 0 }, { rotation: -1.5, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 5, immediateRender: false }, 2.2);

      // --- 1.6s "Ab sofort": stamp slams ---
      tl.set("#stamp", { scale: 3.2, rotation: 40, opacity: 0 }, 0);
      tl.fromTo("#stamp", { scale: 3.2, rotation: 40, opacity: 0 }, { scale: 1, rotation: 10, opacity: 1, duration: 0.35, ease: "power4.in" }, 1.5);
      tl.fromTo("#stamp", { scale: 1 }, { scale: 1.07, duration: 0.6, ease: "sine.inOut", yoyo: true, repeat: 9, immediateRender: false }, 2.0);

      // --- 2.67s "frische Muscheln": words pop, swoosh draws ---
      tl.from("#w-frische", { opacity: 0, y: 80, rotation: -6, duration: 0.45, ease: "back.out(2)" }, 2.6);
      tl.from("#w-muscheln", { opacity: 0, y: 80, rotation: 6, duration: 0.45, ease: "back.out(2)" }, 2.85);
      tl.fromTo("#swoosh-path", { strokeDasharray: 640, strokeDashoffset: 640 }, { strokeDashoffset: 0, duration: 0.5, ease: "power2.inOut" }, 3.05);

      // --- 3.8s "in Weißweinsauce": plate 1 rolls in from the left ---
      tl.from("#plate-wine", { x: -620, rotation: -200, duration: 0.8, ease: "back.out(1.3)" }, 3.6);
      tl.from("#plate-wine .mussels use", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", stagger: 0.05 }, 4.1);
      tl.from("#pill-wine", { opacity: 0, y: 60, scale: 0.6, duration: 0.4, ease: "back.out(2.4)" }, 3.85);
      tl.fromTo("#plate-wine", { rotation: 0 }, { rotation: 10, duration: 5.6, ease: "none" }, 4.4);

      // --- 5.1s "oder Tomatensoße": plate 2 rolls in from the right ---
      tl.from("#plate-tomato", { x: 620, rotation: 200, duration: 0.8, ease: "back.out(1.3)" }, 4.9);
      tl.from("#plate-tomato .mussels use", { opacity: 0, scale: 0.2, transformOrigin: "50% 50%", duration: 0.3, ease: "back.out(3)", stagger: 0.05 }, 5.4);
      tl.from("#pill-tomato", { opacity: 0, y: 60, scale: 0.6, duration: 0.4, ease: "back.out(2.4)" }, 5.15);
      tl.fromTo("#plate-tomato", { rotation: 0 }, { rotation: -10, duration: 4.3, ease: "none" }, 5.7);

      // Steam wiggles above each plate
      tl.fromTo("#steam-wine", { opacity: 0, y: 20 }, { opacity: 0.9, y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 4 }, 4.4);
      tl.fromTo("#steam-tomato", { opacity: 0, y: 20 }, { opacity: 0.9, y: -10, duration: 1.2, ease: "sine.inOut", yoyo: true, repeat: 3 }, 5.7);

      // --- 6.4s "Buon appetito!": script pops, confetti bursts ---
      tl.from("#appetito", { opacity: 0, scale: 0.3, rotation: -10, duration: 0.6, ease: "elastic.out(1, 0.5)" }, 6.3);
      document.querySelectorAll("#confetti .c").forEach((el, i) => {
        const dx = Number(el.dataset.x);
        const dy = Number(el.dataset.y);
        tl.fromTo(el, { x: 0, y: 0, opacity: 0, scale: 0.3 }, { x: dx, y: dy, opacity: 1, scale: 1, rotation: dx > 0 ? 160 : -160, duration: 0.7, ease: "power3.out" }, 6.35 + i * 0.02);
        tl.to(el, { y: dy + 60, rotation: dx > 0 ? 220 : -220, duration: 2.9, ease: "sine.inOut" }, 7.05 + i * 0.02);
      });
      tl.fromTo("#appetito", { y: 0 }, { y: -14, duration: 0.7, ease: "sine.inOut", yoyo: true, repeat: 3 }, 7.0);

      // --- 9.5s: final little bounce on the brand ---
      tl.to("#brand-italia", { scale: 1.08, duration: 0.25, ease: "power2.out", yoyo: true, repeat: 1 }, 9.3);

      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
  </body>
